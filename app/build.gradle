plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tayson.desktop'
    compileSdk 33

    defaultConfig {
        applicationId 'com.tayson.desktop'
        minSdk 23
        // 33 mantém compatibilidade com AGP 7.4.2. Para subir para 34, atualiza o AGP para 8.x.
        targetSdk 33
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
